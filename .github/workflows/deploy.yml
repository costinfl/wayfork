name: Deploy to GitHub Pages

# Builds the app and pushes the output to the `gh-pages` branch;
# GitHub Pages serves the site from that branch (Settings → Pages).
on:
  push:
    branches:
      - main
      - claude/wayfork-setup-github-pages-3pgqfw
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
